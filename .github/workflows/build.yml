# Windows, Linux and macOS builds, run for a v* tag (the archives go to its GitHub release) or by
# hand from the Actions tab (Run workflow: archives as workflow artifacts). Plain pushes
# don't build.
#   Windows: MSYS2 (UCRT64) with raylib and unicorn from pacman, their DLLs next to the exe.
#   Linux:   raylib (static) and unicorn (shared, shipped next to the binary) built from source
#            on the oldest supported Ubuntu, so the binary runs on older glibc too.
#   macOS:   one universal app (arm64 + x86_64, macOS 11+): raylib built universal, unicorn built
#            once per architecture and joined with lipo (both static), the .app made by
#            make_app.sh and signed ad hoc (no Apple developer ID).
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_DIRS: rooms sprites anim props shaders glow fonts

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-unicorn

      - name: Build
        run: |
          cmake -S remaster -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_BUNDLE=ON
          cmake --build build

      - name: Package
        run: |
          OUT="Livingstone Remastered"
          mkdir -p "$OUT/assets"
          cp build/livingstone.exe "$OUT/Livingstone.exe"
          for d in $ASSET_DIRS; do cp -r "remaster/assets/$d" "$OUT/assets/"; done
          # the DLLs the exe needs from the MSYS2 tree (raylib, unicorn, glfw, ...)
          ldd build/livingstone.exe | awk '/\/ucrt64\// {print $3}' | sort -u | xargs -r -I{} cp {} "$OUT/"
          cp LICENSE README.md "$OUT/"
          cat > "$OUT/HOW TO PLAY.txt" <<'EOF'
          Livingstone Remastered

          1. Run Livingstone.exe.
          2. Drag your copy of LSTONE.COM (the original DOS game, not included) onto the window.
             It is remembered, so this is needed only once.

          Keys: arrows to move, Space to fire, 1-4 to pick a weapon, Esc to pause,
          R original/remastered graphics, F full screen. More in README.md.

          Source and license (GPL-2.0): https://github.com/${{ github.repository }}
          EOF
          ls -la "$OUT"
          zip -qr LivingstoneRemastered-windows.zip "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LivingstoneRemastered-windows
          path: LivingstoneRemastered-windows.zip

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LivingstoneRemastered-windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev

      - name: raylib (static)
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DPLATFORM=Desktop -DGLFW_BUILD_WAYLAND=OFF
          sudo cmake --build /tmp/raylib/build --target install

      - name: unicorn (x86 only)
        run: |
          git clone --depth 1 --branch 2.1.4 https://github.com/unicorn-engine/unicorn.git /tmp/unicorn
          cmake -S /tmp/unicorn -B /tmp/unicorn/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUNICORN_ARCH=x86 -DUNICORN_BUILD_TESTS=OFF
          sudo cmake --build /tmp/unicorn/build --target install
          sudo ldconfig

      - name: Build
        run: |
          cmake -S remaster -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_BUNDLE=ON
          cmake --build build

      - name: Package
        run: |
          OUT="Livingstone Remastered"
          mkdir -p "$OUT/assets"
          cp build/livingstone "$OUT/livingstone"
          for d in $ASSET_DIRS; do cp -r "remaster/assets/$d" "$OUT/assets/"; done
          cp -L "$(ldd build/livingstone | awk '/libunicorn/ {print $3}')" "$OUT/"
          ldd "$OUT/livingstone"
          cp LICENSE README.md "$OUT/"
          cat > "$OUT/HOW TO PLAY.txt" <<'EOF'
          Livingstone Remastered

          1. Run ./livingstone (from a terminal, or double-click it in your file manager).
          2. Drag your copy of LSTONE.COM (the original DOS game, not included) onto the window,
             or put it next to the livingstone file. A dropped copy is remembered
             (~/.local/share), so this is needed only once.

          Keys: arrows to move, Space to fire, 1-4 to pick a weapon, Esc to pause,
          R original/remastered graphics, F full screen. More in README.md.

          Source and license (GPL-2.0): https://github.com/${{ github.repository }}
          EOF
          ls -la "$OUT"
          tar czf LivingstoneRemastered-linux-x86_64.tar.gz "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LivingstoneRemastered-linux
          path: LivingstoneRemastered-linux-x86_64.tar.gz

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LivingstoneRemastered-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: raylib (static, universal)
        run: |
          command -v pkg-config || brew install pkgconf
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF -DPLATFORM=Desktop -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_INSTALL_PREFIX=/tmp/rl
          cmake --build /tmp/raylib/build -j --target install

      - name: unicorn (x86 only, static, universal)
        # Unicorn takes its code generator's host from the compiler's own macros (not from the
        # architecture flags), so the x86_64 half is built with a compiler that is x86_64 itself
        run: |
          git clone --depth 1 --branch 2.1.4 https://github.com/unicorn-engine/unicorn.git /tmp/unicorn
          printf '#!/bin/sh\nexec /usr/bin/clang -arch x86_64 "$@"\n' > /tmp/cc-x64 && chmod +x /tmp/cc-x64
          COMMON="-DCMAKE_BUILD_TYPE=Release -DUNICORN_ARCH=x86 -DUNICORN_BUILD_TESTS=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          ARCHFLAGS="-arch arm64" cmake -S /tmp/unicorn -B /tmp/uc-arm $COMMON -DCMAKE_INSTALL_PREFIX=/tmp/uc
          cmake --build /tmp/uc-arm -j
          ARCHFLAGS="-arch x86_64" cmake -S /tmp/unicorn -B /tmp/uc-x64 $COMMON \
            -DCMAKE_C_COMPILER=/tmp/cc-x64 -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build /tmp/uc-x64 -j
          grep HOST_AARCH64 /tmp/uc-arm/config-host.h && grep HOST_X86_64 /tmp/uc-x64/config-host.h
          cmake --install /tmp/uc-arm
          lipo -create /tmp/uc-arm/libunicorn.a /tmp/uc-x64/libunicorn.a -output /tmp/uc/lib/libunicorn.a
          rm -f /tmp/uc/lib/libunicorn*.dylib
          lipo -info /tmp/uc/lib/libunicorn.a

      - name: Build
        run: |
          PKG_CONFIG_PATH=/tmp/rl/lib/pkgconfig:/tmp/uc/lib/pkgconfig cmake -S remaster -B build \
            -DCMAKE_BUILD_TYPE=Release -DAPP_BUNDLE=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j
          lipo -info build/livingstone
          otool -L build/livingstone

      - name: Package
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q pillow  # (the icon)
          VERSION="${{ github.ref_name }}"
          APP_VERSION="${VERSION#v}" PYTHON=/tmp/py/bin/python ./make_app.sh --binary build/livingstone
          cd dist && ditto -c -k --keepParent "Livingstone Remastered.app" ../LivingstoneRemastered-macos.zip
          ls -la ../LivingstoneRemastered-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LivingstoneRemastered-macos
          path: LivingstoneRemastered-macos.zip

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LivingstoneRemastered-macos.zip
